rules:
  - id: no-hardcoded-commandcode-key
    pattern-regex: '\buser_[A-Za-z0-9]{40,120}\b'
    message: "Potential hardcoded Command Code API key detected. Load keys via .env and scripts/build.js instead."
    languages: [regex]
    severity: ERROR

  - id: no-hardcoded-bearer-token
    pattern-regex: 'Bearer\s+[A-Za-z0-9._-]{24,}'
    message: "Potential hardcoded Bearer token detected."
    languages: [regex]
    severity: ERROR

  - id: no-eval-in-mv3-extension
    pattern-either:
      - pattern: eval(...)
      - pattern: new Function(...)
    message: "Avoid eval() and new Function(): blocked by Manifest V3 CSP and creates code injection risks."
    languages: [javascript]
    severity: ERROR

  - id: no-unsafe-dom-xss-sinks
    pattern-either:
      - pattern: $EL.innerHTML = $VAL
      - pattern: $EL.outerHTML = $VAL
      - pattern: document.write(...)
    message: "Avoid unsafe DOM HTML injection sinks in extension scripts; use textContent or createElement instead."
    languages: [javascript]
    severity: ERROR
